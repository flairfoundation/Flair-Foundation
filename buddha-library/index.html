<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Buddha Library - A Unit of Flair Foundation</title>
    
    <link rel="icon" type="image/png" href="/logo.png">
    <link rel="shortcut icon" type="image/png" href="/logo.png">
    <link rel="apple-touch-icon" href="/logo.png">
    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        :root { 
            --brand-blue: #1a237e;  
            --brand-yellow: #fbc02d; 
            --brand-red: #d32f2f;    
            --bg-light: #f4f6f9;
            --text-dark: #2c3e50;
            --white: #ffffff;
        }
        
        body { 
            font-family: system-ui, -apple-system, sans-serif; 
            background-color: var(--bg-light); 
            color: var(--text-dark); 
            line-height: 1.6; 
            -webkit-user-select: none; 
            -moz-user-select: none; 
            -ms-user-select: none; 
            user-select: none; 
        }
        
        /* होम पेज जैसा 100% सेम हेडर */
        .navbar { 
            background-color: var(--brand-blue); 
            padding: 10px 2%; 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            gap: 10px; 
            box-shadow: 0 3px 10px rgba(0,0,0,0.18); 
            position: sticky; 
            top: 0; 
            z-index: 1000; 
        }
        
        .estd-corner {
            position: absolute;
            top: 3px;
            right: 2%;
            font-size: 0.65rem;
            font-weight: 700;
            color: var(--brand-yellow);
            letter-spacing: 0.8px;
            opacity: 0.95;
        }

        .logo-container { 
            display: flex; 
            align-items: center; 
            gap: 10px; 
            text-decoration: none; 
            cursor: pointer;
            flex-shrink: 0;
        }
        
        .logo-container img { 
            height: clamp(44px, 5vw, 56px); 
            width: auto; 
            object-fit: contain; 
        }
        
        .logo-text-box {
            display: flex;
            flex-direction: column;
            justify-content: center;
        }
        
        .logo-text { 
            color: var(--brand-yellow); 
            font-size: clamp(1.05rem, 1.8vw, 1.35rem); 
            font-weight: 800; 
            text-transform: uppercase; 
            letter-spacing: 0.6px; 
            line-height: 1.15;
            white-space: nowrap;
        }
        
        .logo-tagline {
            color: #ff6b6b;
            font-size: clamp(0.72rem, 1.1vw, 0.84rem);
            font-weight: 500;
            letter-spacing: 0.3px;
            margin-top: 2px;
            white-space: nowrap;
        }
        
        .nav-links { 
            display: flex; 
            gap: 5px; 
            list-style: none; 
            align-items: center; 
            flex-wrap: nowrap;
            margin-top: 6px;
        }
        
        .nav-links a { 
            text-decoration: none; 
            color: var(--white); 
            font-weight: 600; 
            font-size: clamp(0.72rem, 0.95vw, 0.85rem); 
            padding: 6px 9px; 
            border-radius: 5px; 
            transition: all 0.2s ease; 
            text-transform: uppercase; 
            letter-spacing: 0.3px;
            white-space: nowrap;
            background: rgba(255, 255, 255, 0.08);
            border-bottom: 2px solid rgba(0, 0, 0, 0.25);
        }
        
        .nav-links a:hover, .nav-links a.active { 
            color: var(--brand-blue); 
            background-color: var(--brand-yellow); 
            font-weight: 700;
            border-bottom: 2px solid #c79100;
            transform: translateY(-1px);
            box-shadow: 0 3px 6px rgba(0,0,0,0.2);
        }
        
        .menu-toggle { 
            display: none; 
            color: var(--brand-yellow); 
            font-size: 1.6rem; 
            cursor: pointer; 
            padding: 4px 10px;
            border-radius: 5px;
            background: rgba(255, 255, 255, 0.1);
        }

        /* Library Hero Banner */
        .lib-hero { background-color: var(--white); padding: 40px 20px; text-align: center; border-bottom: 5px solid var(--brand-yellow); box-shadow: 0 4px 10px rgba(0,0,0,0.05); }
        .lib-logo { width: clamp(120px, 20vw, 160px); height: auto; border-radius: 50%; margin-bottom: 15px; box-shadow: 0 5px 15px rgba(0,0,0,0.15); }
        .lib-hero h1 { color: var(--brand-blue); font-size: clamp(2rem, 5vw, 2.5rem); font-weight: 900; margin-bottom: 5px; text-transform: uppercase; }
        .lib-hero p { color: #555; font-size: clamp(1rem, 2.5vw, 1.15rem); font-weight: 600; }
        .effective-date { color: var(--brand-red); font-weight: 700; margin-top: 10px; font-size: 0.95rem; }

        .container { max-width: 1000px; margin: 40px auto; padding: 0 20px; }
        
        /* Rules Section */
        .section-title { text-align: center; color: var(--brand-blue); font-size: 1.8rem; margin: 40px 0 25px; text-decoration: underline; text-decoration-color: var(--brand-yellow); text-decoration-thickness: 3px; text-transform: uppercase; }
        
        .rule-card { background: #fff; padding: 25px; border-radius: 8px; margin-bottom: 20px; box-shadow: 0 2px 8px rgba(0,0,0,0.05); border-left: 5px solid var(--brand-blue); }
        .rule-card.urgent { border-left-color: var(--brand-red); }
        .rule-card h3 { font-size: 1.25rem; color: var(--brand-blue); margin-bottom: 12px; font-weight: 700; }
        .rule-card ul { list-style: none; margin-left: 0; }
        .rule-card ul li { margin-bottom: 10px; font-size: 1rem; color: #444; position: relative; padding-left: 20px; line-height: 1.5; }
        .rule-card ul li::before { content: "▪"; position: absolute; left: 0; color: var(--brand-yellow); font-size: 1.2rem; line-height: 1.2; }
        
        .highlight-box { background: #fff9c4; padding: 12px; border-radius: 6px; margin-top: 15px; font-size: 0.95rem; color: #f57f17; border: 1px solid #fff59d; font-weight: 600; }

        /* Fee Structure */
        .fee-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 20px; }
        .fee-card { background: white; border: 1px solid #eee; border-radius: 12px; text-align: center; padding: 25px 15px; box-shadow: 0 4px 10px rgba(0,0,0,0.05); transition: 0.3s; position: relative; }
        .fee-card:hover { transform: translateY(-5px); box-shadow: 0 8px 20px rgba(0,0,0,0.1); border-color: var(--brand-blue); }
        .fee-badge { background: var(--brand-blue); color: white; padding: 5px 15px; border-radius: 50px; font-weight: bold; font-size: 0.85rem; display: inline-block; margin-bottom: 15px; letter-spacing: 0.5px; }
        .fee-card h4 { font-size: 1.1rem; color: #555; margin-bottom: 10px; }
        .fee-card .price { font-size: 2.2rem; color: var(--brand-red); font-weight: 800; }
        
        .top-choice { border: 2px solid var(--brand-yellow); background: #fffdf0; }
