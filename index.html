        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        :root {

            --brand-yellow: #fbc02d;

            --text-dark: #333;
            --white: #ffffff;

        body {

            background-color: var(--bg-light); 
            color: var(--text-dark); 
            line-height: 1.6; 
            -webkit-user-select: none; 
            -moz-user-select: none; 
            -ms-user-select: none; 
            user-select: none; 
        }
        
        /* ==========================================

        .navbar { 
            background-color: var(--brand-blue); 
            padding: 14px 3% 12px; 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            gap: 12px 15px; 
            box-shadow: 0 3px 8px rgba(0,0,0,0.15); 
            position: sticky; 
            top: 0; 
            z-index: 1000; 
            flex-wrap: wrap; 
        }
        
        /* कोने में हल्का और साफ ESTD 2017 */
        .estd-tag {
            position: absolute;
            top: 4px;
            right: 3%;
            font-size: 0.68rem;
            font-weight: 600;
            color: rgba(255, 255, 255, 0.85);
            letter-spacing: 0.8px;
        }
        .estd-tag span {
            color: var(--brand-yellow);
            font-weight: 700;
        }

            gap: 12px; 
            text-decoration: none; 
            cursor: pointer;
        }
        .logo-container img { 
            height: clamp(48px, 6vw, 64px); 
            width: auto; 
            object-fit: contain; 
        }
        .logo-text-box {
            display: flex;
            flex-direction: column;
            justify-content: center;
        }
        .logo-text { 
            color: var(--brand-yellow); 
            font-size: clamp(1.15rem, 2.2vw, 1.45rem); 
            font-weight: 800; 
            text-transform: uppercase; 
            letter-spacing: 0.8px; 
            line-height: 1.15;
        }

        .logo-tagline {
            color: #ff6b6b;
            font-size: clamp(0.75rem, 1.3vw, 0.88rem);
            font-weight: 400;
            letter-spacing: 0.4px;
            margin-top: 2px;
        }
