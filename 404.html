<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>पेज नहीं मिला - फ्लेयर फाउंडेशन</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            color: #333;
        }
        .error-container {
            background: #ffffff;
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
            text-align: center;
            max-width: 450px;
            width: 90%;
        }
        h1 {
            font-size: 80px;
            color: #e74c3c;
            margin: 0;
            font-weight: bold;
        }
        h2 {
            font-size: 22px;
            color: #2c3e50;
            margin-top: 10px;
            margin-bottom: 15px;
        }
        p {
            color: #666;
            font-size: 15px;
            line-height: 1.6;
            margin-bottom: 25px;
        }
        .home-btn {
            display: inline-block;
            background-color: #f39c12;
            color: white;
            padding: 12px 25px;
            font-size: 16px;
            font-weight: bold;
            text-decoration: none;
            border-radius: 6px;
            transition: background 0.3s ease;
            box-shadow: 0 4px 10px rgba(243, 156, 18, 0.3);
        }
        .home-btn:hover {
            background-color: #d68910;
        }
    </style>
</head>
<body>

    <div class="error-container">
        <h1>404</h1>
        <h2>ओह! यह पेज अभी तैयार हो रहा है।</h2>
        <p>आप जिस पेज की तलाश कर रहे हैं वह जल्द ही लाइव होने वाला है। फ्लेयर फाउंडेशन से जुड़े रहने के लिए आपका धन्यवाद!</p>
        <a href="/" class="home-btn">🏠 होमपेज पर वापस जाएं</a>
    </div>

</body>
</html>
