<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Page Not Found - Flair Foundation</title>
    <link rel="icon" type="image/png" href="logo.png">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { 
            font-family: system-ui, -apple-system, sans-serif; 
            background: linear-gradient(135deg, #1a237e 0%, #3949ab 100%); 
            color: #ffffff; 
            height: 100vh; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            text-align: center; 
            padding: 20px; 
        }
        .error-container { 
            background: #ffffff; 
            color: #333333; 
            padding: 40px 30px; 
            border-radius: 15px; 
            box-shadow: 0 10px 30px rgba(0,0,0,0.3); 
            max-width: 500px; 
            width: 100%; 
            border-top: 6px solid #fbc02d; 
        }
        .error-container img { height: 70px; margin-bottom: 15px; }
        h1 { color: #d32f2f; font-size: 2.5rem; margin-bottom: 10px; font-weight: 900; }
        h2 { color: #1a237e; font-size: 1.3rem; margin-bottom: 15px; }
        p { font-size: 1rem; color: #666; margin-bottom: 25px; line-height: 1.6; }
        .home-btn { 
            background-color: #fbc02d; 
            color: #1a237e; 
            padding: 12px 30px; 
            text-decoration: none; 
            font-size: 1.1rem; 
            font-weight: 800; 
            border-radius: 50px; 
            display: inline-block; 
            box-shadow: 0 4px 15px rgba(251, 192, 45, 0.4); 
            transition: 0.3s; 
            text-transform: uppercase; 
        }
        .home-btn:hover { background-color: #f9a825; transform: scale(1.05); }
    </style>
</head>
<body>

    <div class="error-container">
        <img src="logo.png" alt="Flair Foundation Logo">
        <h1>404</h1>
        <h2>ओह! यह पेज अभी तैयार हो रहा है।</h2>
        <p>आप जिस पेज की तलाश कर रहे हैं वह जल्द ही लाइव होने वाला है। फ्लेयर फाउंडेशन से जुड़े रहने के लिए आपका धन्यवाद!</p>
        <a href="index.html" class="home-btn">🏠 होमपेज पर वापस जाएं</a>
    </div>

</body>
</html>
